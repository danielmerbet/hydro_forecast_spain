# Daily river forecast: runs the operational chain (codes/run_daily.sh) and
# publishes docs/ to GitHub Pages. Setup: see OPERATIONS.md.
name: daily-forecast

on:
  schedule:
    # 02:17 UTC = 04:17 in Spain in summer (CEST), 03:17 in winter (CET); GitHub cron is UTC only.
    # Uses the previous day's 12 UTC runs (AIFS out by ~19 UTC, WeatherNext 3 complete ~7-13 h after
    # init). Off the full hour on purpose: GitHub delays scheduled runs most at :00.
    - cron: "17 2 * * *"
  workflow_dispatch: {}        # manual "Run workflow" button

permissions:
  contents: write              # commit the updated site

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -el {0}    # login shell so the conda env is active
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: hydrocat
          cache-environment: true

      - name: Install Google's model (pinned) and hydrocat
        run: bash codes/00_setup_ci.sh

      - name: Restore data caches (ACA open data, ERA5-Land monthly means, bridge days, SAIH)
        uses: actions/cache@v4
        with:
          path: |
            data/raw/aca_opendata
            data/raw/era5land_means_catalonia
            data/raw/era5land_means_spain
            data/forecasts/catalonia/bridge
            data/forecasts/spain/bridge
            data/processed/spain/q_obs_daily_saih_*.parquet
          key: data-v2-${{ github.run_id }}
          restore-keys: data-v2-

      - name: Run the daily chain
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
        run: bash codes/run_daily.sh

      - name: Publish the site
        run: |
          git config user.name  "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add docs/
          git commit -m "Forecast $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
