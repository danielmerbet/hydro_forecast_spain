[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrocat"
version = "0.1.0"
description = "Helper library for the Catalonia river-forecast pipeline (GR4J + Google hydrology model)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
